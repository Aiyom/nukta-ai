<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nukta AI</title>
    <link rel="stylesheet" href="/static/styles.css?v=22" />
  </head>
  <body>
    <main class="agent-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <h1>Nukta AI</h1>
            <p>Локальные модели, сайты и артефакты</p>
          </div>
        </div>
        <nav class="tabs" aria-label="Разделы">
          <button class="tab active" data-view="agent" type="button">Агент</button>
          <button class="tab" data-view="search" type="button">Поиск</button>
          <button class="tab" data-view="images" type="button">Картинки</button>
          <button class="tab" data-view="sites" type="button">Сайты</button>
          <button class="tab" data-view="models" type="button">Модели</button>
          <button class="tab" data-view="artifacts" type="button">Артефакты</button>
        </nav>
        <section class="status-card">
          <h2>Стек</h2>
          <dl id="systemFacts"><div><dt>Статус</dt><dd>Проверяю...</dd></div></dl>
        </section>
      </aside>

      <section class="workspace">
        <header class="workspace-header">
          <div>
            <h2 id="viewTitle">Полноценный локальный агент</h2>
          </div>
          <div class="header-actions">
            <button id="benchButton" class="icon-button" type="button" aria-label="Замерить скорость" title="Замерить скорость">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 1 9 9"/><path d="M12 3a9 9 0 1 0 9 9"/><path d="m12 12 4-4"/><path d="M12 7v2"/><path d="M7 12H5"/><path d="M19 12h-2"/></svg>
            </button>
            <button id="clearButton" class="icon-button" type="button" aria-label="Очистить" title="Очистить">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/></svg>
            </button>
          </div>
        </header>

        <section id="agentView" class="view active">
          <div id="conversation" class="conversation" aria-live="polite">
            <article class="empty-state">
              <h3>Дай задачу обычным языком</h3>
              <p>Например: “сгенерируй картинку дерево в пустыне”, “напиши код”, “замерь скорость”.</p>
            </article>
          </div>
          <form id="agentForm" class="composer">
            <textarea id="prompt" class="auto-grow" rows="1" placeholder="Что сделать агенту?"></textarea>
            <button id="runButton" class="send-button" type="submit" aria-label="Запустить" title="Запустить">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
            </button>
          </form>
        </section>

        <section id="searchView" class="view">
          <div id="searchResults" class="search-results"></div>
          <section id="webContext" class="web-context" hidden>
            <div>
              <h3 id="webTitle"></h3>
              <p id="webUrl"></p>
            </div>
            <form id="webAskForm" class="composer compact">
              <textarea id="webQuestion" class="auto-grow" rows="1" placeholder="Спроси по выбранному сайту"></textarea>
              <button class="send-button" type="submit" aria-label="Спросить" title="Спросить">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
              </button>
            </form>
            <div id="webAnswer" class="site-result"></div>
          </section>
          <form id="searchForm" class="site-form">
            <label>
              <span>Запрос</span>
              <textarea id="searchQuery" class="auto-grow" rows="1" placeholder="Например: Qwen3 license Apache 2.0"></textarea>
            </label>
            <button class="send-button" type="submit" aria-label="Искать" title="Искать">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
            </button>
          </form>
        </section>

        <section id="imagesView" class="view">
          <div id="imageResult" class="site-result"></div>
          <form id="imageForm" class="site-form">
            <label>
              <span>Промпт</span>
              <textarea id="imagePrompt" class="auto-grow" rows="1" placeholder="Например: одинокое дерево акации в золотой пустыне, широкие дюны, теплый свет, реалистичное фото"></textarea>
            </label>
            <button class="send-button" type="submit" aria-label="Сгенерировать картинку" title="Сгенерировать картинку">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/></svg>
            </button>
          </form>
        </section>

        <section id="sitesView" class="view">
          <div id="siteResult" class="site-result"></div>
          <form id="siteForm" class="site-form">
            <label>
              <span>Папка / имя сайта</span>
              <input id="siteName" value="my-local-site" />
            </label>
            <label>
              <span>Описание</span>
              <textarea id="sitePrompt" class="auto-grow" rows="1" placeholder="Сделай красивый сайт для кофейни в Дохе, современный, дорогой, с меню и бронированием"></textarea>
            </label>
            <button class="send-button" type="submit" aria-label="Создать сайт" title="Создать сайт">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            </button>
          </form>
        </section>

        <section id="modelsView" class="view">
          <div class="model-toolbar">
            <section class="model-switcher">
              <h3>Активные модели</h3>
              <div class="model-controls">
                <label>
                  <span>Текст</span>
                  <select id="textModelSelect"></select>
                </label>
                <label>
                  <span>Картинки</span>
                  <select id="imageModelSelect"></select>
                </label>
                <button id="applyModelsButton" type="button">Применить</button>
                <button id="restartTextWorkerButton" type="button">Перезапустить</button>
              </div>
              <p id="modelSwitchStatus"></p>
            </section>

            <form id="modelAddForm" class="model-add-form">
              <h3>Добавить модель</h3>
              <label>
                <span>Тип</span>
                <select id="newModelKind">
                  <option value="text">Текст</option>
                  <option value="image">Картинки</option>
                  <option value="video">Видео</option>
                </select>
              </label>
              <label>
                <span>Model ID</span>
                <input id="newModelId" placeholder="mlx-community/Qwen2.5-Coder-7B-Instruct-4bit" />
              </label>
              <label>
                <span>Ссылка / model card</span>
                <input id="newModelUrl" placeholder="https://huggingface.co/..." />
              </label>
              <label>
                <span>Лицензия / заметка</span>
                <input id="newModelLicense" placeholder="Проверь model card перед production" />
              </label>
              <button type="submit">Добавить в агент</button>
            </form>
          </div>
          <div id="modelCatalog" class="model-catalog"></div>
        </section>

        <section id="artifactsView" class="view">
          <div id="artifactList" class="artifact-grid"></div>
        </section>
      </section>

      <aside class="inspector">
        <section>
          <h2>Ход выполнения</h2>
          <ol id="stepList" class="step-list"></ol>
        </section>
        <section>
          <h2>Задачи</h2>
          <div id="taskList" class="task-list"></div>
        </section>
      </aside>
    </main>
    <script src="/static/app.js?v=22"></script>
  </body>
</html>
